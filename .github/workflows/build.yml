name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # needed to attach the APK to a release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

      # Every branch push updates one rolling "test build" release, so the Firestick / TV can
      # always download the newest test APK from the same short link:
      # https://github.com/ryantrotty/StardomWorld/releases/download/test-build/app-debug.apk
      - name: Publish rolling test build (branch pushes)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          target_commitish: ${{ github.sha }}
          name: Test build (${{ github.ref_name }})
          body: "Newest test build, from branch `${{ github.ref_name }}` (commit ${{ github.sha }})."
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
